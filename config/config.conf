# NetPulse Configuration File
# -------------------------------------------------------------
# General Settings
# -------------------------------------------------------------
NETPULSE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
LOG_FILE="${NETPULSE_DIR}/logs/incidents.log"
REPORT_FILE="${NETPULSE_DIR}/reports/health_report.txt"

# -------------------------------------------------------------
# System Health Thresholds (%)
# -------------------------------------------------------------
CPU_LIMIT=90
MEMORY_LIMIT=85
DISK_LIMIT=80

# -------------------------------------------------------------
# Network Monitoring Settings
# -------------------------------------------------------------
PING_HOST="8.8.8.8"
DNS_TEST_HOST="google.com"
APP_HOST="127.0.0.1"
APP_PORT="8080"
HTTP_ENDPOINT="http://127.0.0.1:8080"
HTTP_EXPECTED_CODE="200"

# -------------------------------------------------------------
# Service & Recovery Settings
# -------------------------------------------------------------
SERVICE_NAME="nginx"
ENABLE_AUTO_RECOVERY="true"
MAX_RESTART_ATTEMPTS=1
RECOVERY_COOLDOWN=5

# -------------------------------------------------------------
# Automation / Scheduling Settings
# -------------------------------------------------------------
CHECK_INTERVAL=300
